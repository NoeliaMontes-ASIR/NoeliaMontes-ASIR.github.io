<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="instagram_flex.css">
    <title>instagram</title>
</head>

<body>
    <div class="card">
        <div class="header">
            <div class="avatar"></div>
            <div class="user-info">
                <h3>Juan Nadie</h3>
                <p>Frontend Developer</p>
            </div>
        </div>
        <p class="bio">Apasionado por el CSS y los diseños limpios. Aprendiendo Flexbox hoy mismo.</p>
        <div class="stats">
            <div class="stat-item"><strong>1.2k</strong><span>Seguidores</span></div>
            <div class="stat-item"><strong>45</strong><span>Posts</span></div>
            <div class="stat-item"><strong>800</strong><span>Likes</span></div>
        </div>
        <div class="actions">
            <button class="btn-seguir"><b>Seguir</b></button>
            <button class="btn-msn"><b>Msn</b></button>
        </div>
    </div>
</body>

</html>
