<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>tiempo ahora</h1>
    <input type="button" id="run" value="RUN">
    <div id="resultado"></div>

    <script>
        //variables
        let boton=document.getElementById("run")
        let resultado=document.getElementById("resultado")

        //eventos

        boton.addEventListener("click", (e) => {
            // lo de response, data y error hemos pesto eso pq queremos, podriamos poner cualquier nombre
            //con el return del de arriba lleva a abajo
            // el data.time es buiscar algo dentor de otra cosa. osea busca el time dentro de la data.
            fetch("https://timeapi.io/api/Time/current/zone?timeZone=Europe/Madrid")
                .then(response => {
                    resultado.innerHTML=("todo bien")
                    return response.json()
                })
                .then(data => resultado.innerHTML=data.time)
                .catch(error => resultado.innerHTML=("Errrrrroooooorr: "+error))
             })

    </script>
</body>
</html>
